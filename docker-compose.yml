# Segunda capa: los cinco microservicios del contrato microservicios-pdf.
#
# Va encima de la primera capa, la infraestructura compartida del repo dockers (Consul,
# Traefik, MongoDB y Redis), que se levanta antes con dockers/levantar.ps1. Todo se
# conecta por la red externa redutn. Cada servicio se registra en Consul con el token de
# microservicios y el orquestador descubre las instancias sanas con su propio token de
# solo lectura; los dos llegan como Docker secret desde ../dockers/consul/generated.
name: integracion-pdf

services:
  orquestador:
    image: orquestador:${ORQUESTADOR_VERSION:?definir en .env}
    env_file: ./env/orquestador.env
    secrets:
      - source: consul_orchestrator_token
        target: /run/secrets/consul_orchestrator_token
    networks: [redutn]
    # Único servicio público, por el Traefik de la infraestructura. Los demás no llevan
    # labels ni etiquetas de Traefik en Consul: quedan solo en la red interna.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orquestador.rule=Host(`${ORQUESTADOR_HOST:?definir en .env}`)"
      - "traefik.http.routers.orquestador.entrypoints=https"
      - "traefik.http.routers.orquestador.tls=true"
      - "traefik.http.services.orquestador.loadbalancer.server.port=8000"
    depends_on:
      validacion-pdf:
        condition: service_healthy
      extraccion-texto:
        condition: service_healthy
      persistencia-actualizaciones:
        condition: service_healthy
      persistencia-consultas:
        condition: service_healthy
    stop_grace_period: 40s
    restart: unless-stopped

  validacion-pdf:
    image: validacion-pdf:${VALIDACION_VERSION:?definir en .env}
    env_file: ./env/validacion.env
    secrets: [consul_microservices_token]
    networks: [redutn]
    stop_grace_period: 40s
    restart: unless-stopped

  extraccion-texto:
    image: extraccion-texto:${EXTRACCION_VERSION:?definir en .env}
    env_file: ./env/extraccion.env
    secrets: [consul_microservices_token]
    networks: [redutn]
    # Cada réplica se registra en Consul con su propia IP (extraccion.env no fija
    # CONSUL_SERVICE_ADDRESS) y su propio health check. El orquestador reparte entre las
    # instancias sanas y, si una falla, el reintento va a la siguiente.
    deploy:
      replicas: 3
    stop_grace_period: 40s
    restart: unless-stopped

  persistencia-actualizaciones:
    image: persistencia-actualizaciones:${ACTUALIZACIONES_VERSION:?definir en .env}
    env_file: ./env/actualizaciones.env
    secrets: [consul_microservices_token]
    networks: [redutn]
    # No arranca si MongoDB no responde (decisión del servicio): si la infraestructura
    # todavía no está lista, Docker lo reinicia hasta que lo esté.
    stop_grace_period: 40s
    restart: unless-stopped

  persistencia-consultas:
    image: persistencia-consultas:${CONSULTAS_VERSION:?definir en .env}
    env_file: ./env/consultas.env
    secrets: [consul_microservices_token]
    networks: [redutn]
    stop_grace_period: 40s
    restart: unless-stopped

networks:
  redutn:
    external: true

# Archivos generados por dockers/levantar.ps1 (ignorados por Git en ese repo). El valor
# nunca aparece en este archivo ni en los logs.
secrets:
  consul_microservices_token:
    file: ../dockers/consul/generated/microservices.token
  consul_orchestrator_token:
    file: ../dockers/consul/generated/orchestrator.token
