# Integración de los cinco microservicios del contrato microservicios-pdf.
# Requiere la red externa: docker network create redutn
name: integracion-pdf

services:
  orquestador:
    image: orquestador:${ORQUESTADOR_VERSION:?definir en .env}
    env_file: ./env/orquestador.env
    networks: [redutn]
    # Único servicio público, a través del Traefik del equipo (dockers/traefik). El resto
    # no lleva labels: con exposedByDefault=false queda solo en la red interna.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orquestador.rule=Host(`${ORQUESTADOR_HOST:?definir en .env}`)"
      - "traefik.http.routers.orquestador.entrypoints=https"
      - "traefik.http.routers.orquestador.tls=true"
      - "traefik.http.services.orquestador.loadbalancer.server.port=8000"
    depends_on:
      validacion-pdf:
        condition: service_healthy
      extraccion-texto:
        condition: service_healthy
      persistencia-actualizaciones:
        condition: service_healthy
      persistencia-consultas:
        condition: service_healthy
    restart: unless-stopped

  validacion-pdf:
    image: validacion-pdf:${VALIDACION_VERSION:?definir en .env}
    env_file: ./env/validacion.env
    networks: [redutn]
    restart: unless-stopped

  extraccion-texto:
    image: extraccion-texto:${EXTRACCION_VERSION:?definir en .env}
    env_file: ./env/extraccion.env
    networks: [redutn]
    # pypdf corre en el threadpool y compite por el GIL: un proceso no pasa de ~8 PDF/s.
    # Con 3 réplicas se llega a ~41 PDF/s (ver README, "Prueba de carga").
    deploy:
      replicas: 3
    restart: unless-stopped

  persistencia-actualizaciones:
    image: persistencia-actualizaciones:${ACTUALIZACIONES_VERSION:?definir en .env}
    env_file: ./env/actualizaciones.env
    networks: [redutn]
    # No arranca si MongoDB no responde (decisión del servicio): espera el healthcheck
    # y, si MongoDB se cae después, Docker lo reinicia.
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  persistencia-consultas:
    image: persistencia-consultas:${CONSULTAS_VERSION:?definir en .env}
    env_file: ./env/consultas.env
    networks: [redutn]
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # MongoDB y Redis no publican puertos: Traefik usa 27017 y 6379 como entrypoints TCP.
  mongodb:
    image: mongo:7.0
    volumes:
      - mongo_data:/data/db
    networks: [redutn]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    # Solo caché: sin snapshot ni AOF. Si Redis se reinicia arranca vacío, en vez de
    # recuperar un snapshot con datos que persistencia-actualizaciones ya invalidó.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [redutn]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  redutn:
    external: true

volumes:
  mongo_data:
